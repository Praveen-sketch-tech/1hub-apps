<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 Admin - Document Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-panel { background: var(--light); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; }
        .admin-panel h3 { margin-bottom: 15px; color: var(--dark); }
        .admin-panel .form-row { display: flex; gap: 15px; flex-wrap: wrap; }
        .admin-panel .form-row .form-group { flex: 1; min-width: 200px; }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: white;
            max-width: 700px;
            width: 95%;
            max-height: 90vh;
            padding: 30px;
            border-radius: var(--radius);
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .modal .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal .modal-header h3 { margin: 0; }
        .modal .close-btn { font-size: 1.5rem; cursor: pointer; color: var(--gray); }
        .modal .close-btn:hover { color: var(--danger); }
    </style>
</head>
<body>
    <div class="login-screen" id="loginScreen">
        <div class="logo">🔐</div>
        <h2>Admin Login</h2>
        <p class="sub">Enter credentials to manage documents</p>
        <input type="password" id="adminPassword" placeholder="Enter admin password">
        <button onclick="adminLogin()">Login</button>
        <div class="error-msg" id="loginError">❌ Invalid password</div>
    </div>

    <div class="app-container" id="mainContainer" style="display:none;">
        <header class="app-header">
            <div class="brand">
                <span>🔐</span> Admin<span style="color:var(--primary);">Dashboard</span>
            </div>
            <div class="header-actions">
                <div class="lang-toggle">
                    <button class="lang-btn active" onclick="setLanguage('en')">🇬🇧 EN</button>
                    <button class="lang-btn" onclick="setLanguage('hi')">🇮🇳 HI</button>
                </div>
            </div>
        </header>

        <div class="status-bar" id="statusBar"></div>

        <div class="dashboard-stats">
            <div class="stat-card"><div class="number" id="statTotal">0</div><div class="label">Total Documents</div></div>
            <div class="stat-card"><div class="number" id="statActive">0</div><div class="label">Active</div></div>
            <div class="stat-card"><div class="number" id="statCategories">0</div><div class="label">Categories</div></div>
            <div class="stat-card"><div class="number" id="statFields">0</div><div class="label">Total Fields</div></div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('documents')">📄 Documents</button>
            <button class="tab-btn" onclick="switchTab('upload')">📤 Upload</button>
            <button class="tab-btn" onclick="switchTab('categories')">📂 Categories</button>
            <button class="tab-btn" onclick="switchTab('keywords')">🔑 Keywords</button>
        </div>

        <div class="tab-content active" id="tab-documents">
            <div class="admin-panel">
                <h3>📄 Manage Documents</h3>
                <div id="documentsList"></div>
            </div>
        </div>

        <div class="tab-content" id="tab-upload">
            <div class="admin-panel">
                <h3>📤 Upload New Document</h3>
                <div class="form-group">
                    <label>Document Name *</label>
                    <input type="text" id="docName" placeholder="e.g., Rent Agreement" required>
                </div>
                <div class="form-group">
                    <label>Hindi Name</label>
                    <input type="text" id="docNameHi" placeholder="e.g., किराया समझौता">
                </div>
                <div class="form-group">
                    <label>Category *</label>
                    <select id="docCategory" required></select>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <input type="text" id="docDescription" placeholder="Brief description">
                </div>
                <div class="form-group">
                    <label>Upload Template (.docx or .txt) *</label>
                    <input type="file" id="fileUpload" accept=".docx,.txt" required>
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="docStatus">
                        <option value="active">Active</option>
                        <option value="inactive">Inactive</option>
                    </select>
                </div>
                <button class="btn btn-primary" onclick="uploadDocument()">📤 Upload</button>
            </div>
        </div>

        <div class="tab-content" id="tab-categories">
            <div class="admin-panel">
                <h3>📂 Manage Categories</h3>
                <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;">
                    <input type="text" id="newCategoryName" placeholder="Name" style="flex:1;min-width:150px;padding:10px;border:2px solid var(--border);border-radius:8px;">
                    <input type="text" id="newCategoryNameHi" placeholder="Hindi Name" style="flex:1;min-width:150px;padding:10px;border:2px solid var(--border);border-radius:8px;">
                    <input type="text" id="newCategoryIcon" placeholder="Icon" style="flex:0.5;min-width:60px;padding:10px;border:2px solid var(--border);border-radius:8px;">
                    <input type="color" id="newCategoryColor" value="#667eea" style="flex:0.3;min-width:50px;padding:5px;border:2px solid var(--border);border-radius:8px;">
                    <button class="btn btn-success" onclick="addCategory()">+ Add</button>
                </div>
                <div id="categoriesList" class="categories-grid"></div>
            </div>
        </div>

        <div class="tab-content" id="tab-keywords">
            <div class="admin-panel">
                <h3>🔑 Manage Keywords</h3>
                <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;">
                    <input type="text" id="newKeyword" placeholder="Keyword" style="flex:1;min-width:150px;padding:10px;border:2px solid var(--border);border-radius:8px;">
                    <select id="newKeywordType" style="padding:10px;border:2px solid var(--border);border-radius:8px;">
                        <option value="text">Text</option>
                        <option value="number">Number</option>
                        <option value="date">Date</option>
                        <option value="email">Email</option>
                        <option value="phone">Phone</option>
                    </select>
                    <button class="btn btn-success" onclick="addKeyword()">+ Add</button>
                </div>
                <div id="keywordsList" class="keywords-container"></div>
            </div>
        </div>

        <footer style="margin-top:30px;padding:15px 0;border-top:1px solid var(--border);text-align:center;color:var(--gray);font-size:0.85rem;">
            Document Generator Admin • v2.0
        </footer>
    </div>

    <div class="modal-overlay" id="editModal">
        <div class="modal">
            <div class="modal-header">
                <h3>✏️ Edit Document</h3>
                <span class="close-btn" onclick="closeEditModal()">×</span>
            </div>
            <div class="form-group"><label>Document Name *</label><input type="text" id="editDocName"></div>
            <div class="form-group"><label>Hindi Name</label><input type="text" id="editDocNameHi"></div>
            <div class="form-group"><label>Category</label><select id="editDocCategory"></select></div>
            <div class="form-group"><label>Description</label><input type="text" id="editDocDescription"></div>
            <div class="form-group"><label>Status</label><select id="editDocStatus"><option value="active">Active</option><option value="inactive">Inactive</option></select></div>
            <div class="form-group"><label>Fields (JSON)</label><textarea id="editDocFields" rows="8" style="font-family:monospace;"></textarea></div>
            <button class="btn btn-primary" onclick="saveDocumentEdit()">💾 Save</button>
            <button class="btn btn-outline" onclick="closeEditModal()" style="margin-left:10px;">Cancel</button>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
