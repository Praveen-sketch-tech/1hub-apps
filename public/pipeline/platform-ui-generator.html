<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Platform UI Generator - Tool 08</title>
<style>
:root{--bg:#f2f4f6;--ink:#14202b;--mute:#5d6b78;--line:#d6dce2;--card:#fff;--acc:#0f766e;--acc2:#0b5a54}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1400px;margin:0 auto;padding:20px}
h1{font-size:24px;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 16px}

/* Status bar */
.statusbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.stat{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:13px}
.stat .dot{width:8px;height:8px;border-radius:50%;background:#94a3b8}
.stat.ok .dot{background:#22c55e}
.stat.bad .dot{background:#ef4444}
.stat b{color:var(--mute);font-weight:600}

/* Source bar */
.srcbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:14px}
.srcbar .lbl{font-weight:600;color:var(--mute);font-size:13px;margin-right:4px}

.input{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
textarea#src{width:100%;height:200px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:10px;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;color:var(--ink);background:#fafbfc}
textarea#src:focus{outline:2px solid var(--acc);border-color:transparent}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
button,select,input[type=text]{font:inherit;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 14px;cursor:pointer}
button:hover{background:#eef1f4}
button:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.primary:hover{background:var(--acc2)}
button.success{background:#16a34a;border-color:#16a34a;color:#fff;font-weight:600}
button.success:hover{background:#15803d}
button:disabled{opacity:.45;cursor:not-allowed}
.sp{flex:1}
input[type=text]{cursor:text}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.ph{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.ph strong{margin-right:auto}
.ph button{padding:5px 10px;font-size:13px}
iframe{width:100%;height:75vh;min-height:520px;border:0;background:#fff}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9999}
.toast.on{opacity:1}
.cfg-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.cfg-row label{font-size:13px;font-weight:600;color:var(--mute)}
.cfg-row input[type=text]{padding:6px 10px;font-size:13px;width:180px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎨 Platform UI Generator</h1>
  <p class="sub">Tool 07 ke app skeleton me naya UI generate karta hai — old design wapas nahi aayega</p>

  <!-- STATUS -->
  <div class="statusbar">
    <div class="stat" id="stat01"><span class="dot"></span><b>Tool 01:</b><span id="stat01v">checking...</span></div>
    <div class="stat" id="stat07"><span class="dot"></span><b>Tool 07:</b><span id="stat07v">checking...</span></div>
    <div class="stat" id="statShared"><span class="dot"></span><b>pipe_shared:</b><span id="statSharedv">checking...</span></div>
  </div>

  <!-- SOURCE BAR -->

    <span class="lbl">Load from:</span>
    <button id="loadFrom07" title="Tool 07 ka generated app">📦 Tool 07</button>
    <button id="loadFrom01" title="Tool 01 ka cleaned HTML">🧹 Tool 01 (recommended)</button>
    <button id="loadSample">📋 Sample</button>
    <button id="clear">🧹 Clear</button>
  </div>

  <!-- INPUT -->

    <textarea id="src" spellcheck="false" placeholder="Tool 07 se data load karo, ya HTML paste karo..."></textarea>
    <div class="row">
      <label for="appName" style="font-size:13px;font-weight:600;color:var(--mute)">App Name:</label>

</div>

  // ============================================================
  // AUTO UI (unchanged from original)
  // ============================================================
  function autoUI(){
    var M={card:'card',tile:'card',btn:'btn',button:'btn',cta:'btn',back:'btn',modal:'overlay',overlay:'overlay',backdrop:'overlay',popup:'overlay',
     dialog:'dialog',box:'dialog',sheet:'dialog',panel:'panel',widget:'panel',bottom:'panel',toast:'toast',snackbar:'toast',alert:'alert',error:'alert',
     banner:'alert',dropzone:'drop',drop:'drop',dz:'drop',uploader:'drop',chip:'chip',badge:'chip',tag:'chip',pill:'chip',grid:'grid',toolbar:'bar',
     actions:'bar',action:'bar',controls:'bar',topbar:'bar',row:'bar',group:'bar',tabs:'bar',nav:'bar',zoom:'bar',bar:'bar',head:'head',header:'head',
     foot:'head',footer:'foot',list:'list',item:'item',entry:'item',title:'title',ttl:'title',heading:'title',desc:'muted',dsc:'muted',description:'muted',
     tagline:'muted',sub:'muted',subtitle:'muted',hint:'muted',meta:'muted',note:'muted',caption:'muted',info:'muted',label:'muted',stat:'muted',
     loading:'muted',empty:'muted',name:'name',fname:'name',filename:'name',ico:'icon',icon:'icon',idx:'index',num:'index',spin:'spin',spinner:'spin',
     loader:'spin',fill:'fill',sep:'sep',divider:'sep',editor:'editor',field:'field',hit:'hit',viewer:'stage',stage:'stage'};
    var MODS=['small','sm','ghost','secondary','danger'];
    function toks(s){return s.replace(/([a-z])([A-Z])/g,'$1 $2').toLowerCase().split(/[^a-z0-9]+/).filter(Boolean).map(function(w){return w.replace(/\d+$/,'')});}
    function classify(el){
      if(el.nodeType!==1||el.namespaceURI!=='http://www.w3.org/1999/xhtml')return;
      var tag=el.tagName.toLowerCase();
      if(/^(script|style|link|meta|head|html|body|canvas|br)$/.test(tag))return;
      var names=(el.getAttribute('class')||'').split(/\s+/).concat(el.id||'').filter(Boolean);
      var R={},all={};
      names.forEach(function(n){
        var t=toks(n),found=null;
        t.forEach(function(x){all[x]=1});
        for(var i=t.length-1;i>=0&&!found;i--){
          var w=t[i],r=M[w],pl=false;
          if(!r&&/s$/.test(w)&&M[w.slice(0,-1)]){r=M[w.slice(0,-1)];pl=true;}
          if(r){
            if(pl){r=r==='card'?'grid':r==='item'?'list':r==='chip'?'bar':r;}
            found=r;
          }
        }
        if(found)R[found]=1;
      });
      var isBtn=tag==='button'||(tag==='input'&&/^(button|submit|reset)$/.test(el.type));
      if(isBtn&&!R.card)R.btn=1;
      if(R.card)delete R.btn;
      if(R.btn){
        var txt=el.textContent.trim();
        if(isBtn&&(txt.length<=2||(el.children.length&&!txt)))R.iconbtn=1;
        else if(all.primary||all.cta||el.type==='submit'||!el.getAttribute('class'))R.primary=1;
        if(all.primary)R.primary=1;
      }
      if(R.head||(tag==='header'&&!Object.keys(R).length)){
        delete R.head;
        var kids=[].slice.call(el.children);
        var h1=kids.some(function(c){return /^h1$/i.test(c.tagName)});
        var txtk=kids.some(function(c){return /^(h[1-6]|p)$/i.test(c.tagName)});
        R[h1?'hero':txtk?'stack':'bar']=1;
      }
      if(R.bar&&[].some.call(el.children,function(c){return /fill/i.test(c.id+' '+c.getAttribute('class'))})){delete R.bar;R.track=1;}
      if(/^(ul|ol)$/.test(tag)&&el.firstElementChild&&el.firstElementChild.getAttribute('class'))R.list=1;
      if(el.parentElement===document.body&&/^(div|main)$/.test(tag)&&!Object.keys(R).length)R.wrap=1;
      MODS.forEach(function(m){if(all[m])R[m]=1});
      var v=Object.keys(R).join(' ');
      if(v)el.setAttribute('data-ui',v);else el.removeAttribute('data-ui');
    }
    function scan(n){if(n.nodeType!==1)return;classify(n);var a=n.querySelectorAll('*');for(var i=0;i<a.length;i++)classify(a[i]);}
    function start(){
      scan(document.body);
      document.body.setAttribute('data-ui',document.querySelector('[data-ui~=wrap]')?'page':'page narrow');
      new MutationObserver(function(ms){
        ms.forEach(function(m){
          if(m.type==='childList'){m.addedNodes.forEach(scan);}
          else if(m.type==='attributes'){scan(m.target);}
        });
      }).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class','id']});
    }
    if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
  }

  // ============================================================
  // BUILD
  // ============================================================
  function build(code, themeKey){
    var css = '<style id="auto-ui">' + designCSS(THEMES[themeKey]) + '</style>';
    var js = '<script id="auto-ui-js">(' + autoUI.toString() + ')()<\/script>';
    var meta = '<meta name="viewport" content="width=device-width, initial-scale=1">';
    var inject = css + js;
    var hasHtml = /<html[\s>]/i.test(code);
    var plain = hasHtml ? code : ['<!DOCTYPE html>','<html lang="en">','<head>','<meta charset="UTF-8">',meta,'<title>Preview</title>','</head>','<body>',code,'</body>','</html>'].join('\n');
    var styled;
    if (/<\/head>/i.test(plain)) styled = plain.replace(/<\/head>/i, function(){ return inject + '\n</head>'; });
    else if (/<head[\s>]/i.test(plain)) styled = plain.replace(/<head[^>]*>/i, function(m){ return m + inject; });
    else if (/<html[^>]*>/i.test(plain)) styled = plain.replace(/<html[^>]*>/i, function(m){ return m + '<head>' + meta + inject + '</head>'; });
    else styled = inject + plain;
    if (!/name=["']viewport["']/i.test(styled)) styled = styled.replace(/<head[^>]*>/i, function(m){ return m + meta; });
    return { plain: plain, styled: styled };
  }

  // ============================================================
  // GENERATE
  // ============================================================
  function generate(){
    var code = $("src").value.trim();
    if (!code){ toast("Pehle source load karo ya paste karo"); return; }
    var r = build(code, $("theme").value);
    out.plain = r.plain; out.styled = r.styled;
    $("fPlain").srcdoc = r.plain;
    $("fStyled").srcdoc = r.styled;
    $("savePipe").disabled = false;
    toast("UI generated ✅");
    console.log("[08] UI generated | plain:", r.plain.length, "chars | styled:", r.styled.length, "chars");
  }

  // ============================================================
  // LOAD SOURCES
  // ============================================================
  function loadFromTool07() {
    var p07 = window.Pipe.load('07');
    if (!p07 || !p07.files) {
      toast("Tool 07 ka data nahi mila. Pehle Tool 07 chalao.", true);
      return;
    }

    var html = p07.files['index.html'] || '';
    if (!html.trim()) {
      toast("Tool 07 ka HTML khaali hai", true);
      return;
    }

    $('src').value = html;
    $('appName').value = p07.appName || 'app';
    currentAppName = p07.appName || 'app';
    toast("Loaded from Tool 07: " + p07.appName);
    console.log('[08] Loaded from pipe_07:', p07.appName, '|', html.length, 'chars');
  }

  function loadFromTool01() {
    var p01 = window.Pipe.load('01');
    if (!p01 || typeof p01 !== 'string') {
      toast("Tool 01 ka data nahi mila. Pehle Tool 01 chalao.", true);
      return;
    }

    $('src').value = p01;
    if (!currentAppName) {
      $('appName').value = 'my-app';
      currentAppName = 'my-app';
    }
    toast("Loaded from Tool 01 (cleaned HTML)");
    console.log('[08] Loaded from pipe_01:', p01.length, 'chars');
  }

  function loadSample() {
    $('src').value = '<h1>Contact Us</h1>\n<p>Fill the form and we will get back to you.</p>\n<form onsubmit="event.preventDefault();document.getElementById(\'msg\').textContent=\'Thanks, \'+this.name.value+\'!\'">\n  <label>Name</label>\n  <input name="name" type="text" placeholder="Your name">\n  <label>Email</label>\n  <input type="email" placeholder="you@example.com">\n  <label>Topic</label>\n  <select><option>Support</option><option>Sales</option></select>\n  <label>Message</label>\n  <textarea></textarea>\n  <button type="submit">Send</button>\n</form>\n<p id="msg"></p>\n<h2>Plans</h2>\n<table>\n  <tr><th>Plan</th><th>Price</th></tr>\n  <tr><td>Basic</td><td>$5</td></tr>\n  <tr><td>Pro</td><td>$12</td></tr>\n</table>';
    $('appName').value = 'sample-app';
    currentAppName = 'sample-app';
    toast("Sample loaded");
  }

  function clearAll() {
    $('src').value = '';
    $('appName').value = '';
    currentAppName = '';
    out.plain = out.styled = '';
    $('fPlain').srcdoc = '';
    $('fStyled').srcdoc = '';
    $('savePipe').disabled = true;
    toast("Cleared");
  }

  // ============================================================
  // SAVE TO PIPE_08
  // ============================================================
  function savePipe() {
    if (!out.styled) {
      toast("Pehle Generate karo", true);
      return;
    }
    if (!currentAppName) {
      currentAppName = ($('appName').value || 'app').trim();
    }

    window.Pipe.save('08', {
      appName: currentAppName,
      appTitle: currentAppName,
      theme: $('theme').value,
      plainHtml: out.plain,
      styledHtml: out.styled,
      generatedAt: new Date().toISOString()
    });

    toast("Saved to pipe_08 ✅");
    console.log('[08] Saved to pipe_08:', currentAppName, '| styled:', out.styled.length, 'chars');
  }

  // ============================================================
  // STATUS
  // ============================================================
  function updateStatus() {
    var p01 = window.Pipe.load('01');
    var p07 = window.Pipe.load('07');
    var shared = window.Pipe.load('shared');

    var has01 = !!(p01 && typeof p01 === 'string');
    var has07 = !!(p07 && p07.appName);
    var hasShared = !!(shared && shared.functions);

    setStat('stat01', 'stat01v', has01, has01 ? p01.length + ' chars' : 'missing');
    setStat('stat07', 'stat07v', has07, has07 ? p07.appName : 'missing');
    setStat('statShared', 'statSharedv', hasShared, hasShared ? Object.keys(shared.functions).length + ' funcs' : 'missing');
  }

  function setStat(elId, valId, ok, text) {
    var el = $(elId);
    el.className = 'stat ' + (ok ? 'ok' : 'bad');
    $(valId).textContent = text;
  }

  // ============================================================
  // TOAST
  // ============================================================
  function toast(msg, isErr) {
    var t = $("toast");
    t.textContent = msg;
    t.classList.add("on");
    if (isErr) t.style.background = '#b91c1c';
    else t.style.background = '';
    clearTimeout(toast.h);
    toast.h = setTimeout(function(){ t.classList.remove("on"); }, 2000);
  }

  // ============================================================
  // COPY / DOWNLOAD
  // ============================================================
  async function copyText(text){
    try { await navigator.clipboard.writeText(text); return true; }
    catch(e){
      var ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand("copy"); } catch(_){}
      ta.remove(); return ok;
    }
  }

  function download(name, text){
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], {type:"text/html"}));
    a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
  }

  document.querySelectorAll("[data-copy]").forEach(function(b){ b.onclick = async function(){
    var k = b.dataset.copy;
    if (!out[k]){ toast("Pehle Generate karo"); return; }
    toast(await copyText(out[k]) ? "Code copied" : "Copy failed");
  };});

  document.querySelectorAll("[data-dl]").forEach(function(b){ b.onclick = function(){
    var k = b.dataset.dl;
    if (!out[k]){ toast("Pehle Generate karo"); return; }
    var name = (currentAppName || 'app') + (k === 'plain' ? '-plain.html' : '-ui.html');
    download(name, out[k]);
  };});

  // ============================================================
  // WIRING
  // ============================================================
  $("gen").onclick = generate;
  $("theme").onchange = function(){ if ($("src").value.trim()) generate(); };
  $("loadFrom07").onclick = loadFromTool07;
  $("loadFrom01").onclick = loadFromTool01;
  $("loadSample").onclick = loadSample;
  $("clear").onclick = clearAll;
  $("savePipe").onclick = savePipe;

  // ============================================================
  // INIT
  // ============================================================
  window.addEventListener('load', function() {
    console.log('[08] init called');
    updateStatus();

    // Auto-load from Tool 07 if available
    var p07 = window.Pipe.load('07');
    if (p07 && p07.files && p07.files['index.html']) {
      console.log('[08] Auto-loading from Tool 07:', p07.appName);
      loadFromTool07();
      // Auto-generate after short delay
      setTimeout(generate, 300);
    } else {
      // Fallback: try Tool 01
      var p01 = window.Pipe.load('01');
      if (p01 && typeof p01 === 'string') {
        console.log('[08] Auto-loading from Tool 01');
        loadFromTool01();
        setTimeout(generate, 300);
      } else {
        console.log('[08] No source. Manual mode.');
      }
    }
  });

})();
</script>
</body>
</html>
