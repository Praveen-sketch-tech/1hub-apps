<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🧩 Shared Function Matcher</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: linear-gradient(145deg, #f6f9fc 0%, #e9f2f9 100%);
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 2.5rem;
      padding: 2.5rem 2rem;
      max-width: 1000px;
      width: 100%;
      box-shadow: 0 30px 50px -20px rgba(0, 40, 80, 0.25), 0 0 0 1px rgba(156, 188, 222, 0.3);
    }
    h1 {
      font-size: 2.2rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: #0b2b4b;
      margin-bottom: 0.2rem;
    }
    h1 span {
      background: #1e5a8b;
      color: white;
      font-size: 1.2rem;
      padding: 0.15rem 1rem;
      border-radius: 40px;
      font-weight: 500;
      margin-left: 0.5rem;
      letter-spacing: 0.3px;
    }
    .subhead {
      color: #3b5e7e;
      margin-bottom: 2rem;
      font-weight: 400;
      font-size: 1.1rem;
      border-left: 4px solid #8ab3d4;
      padding-left: 1rem;
      margin-top: 0.5rem;
    }
    .grid {
      display: flex;
      flex-wrap: wrap;
      gap: 2rem;
      align-items: flex-start;
    }
    .panel {
      flex: 1 1 260px;
      background: #ffffffd9;
      border-radius: 1.8rem;
      padding: 1.5rem;
      box-shadow: 0 6px 18px rgba(0, 30, 60, 0.06);
      border: 1px solid #c9ddeb;
    }
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
      font-weight: 600;
      color: #0f3b5c;
      font-size: 1rem;
    }
    .panel-header i {
      font-style: normal;
      font-size: 0.8rem;
      background: #dfeaf3;
      padding: 0.2rem 0.7rem;
      border-radius: 40px;
      font-weight: 500;
      color: #1a4b6e;
    }
    .function-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 0.8rem;
      max-height: 200px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .function-list::-webkit-scrollbar { width: 5px; }
    .function-list::-webkit-scrollbar-thumb { background: #b8d0e5; border-radius: 20px; }
    .function-item {
      background: #f4f9ff;
      border-radius: 1rem;
      padding: 0.6rem 0.9rem;
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-left: 4px solid #3b7eb0;
      color: #113752;
      word-break: break-word;
    }
    .function-item.detected-item {
      border-left-color: #4a9fd8;
      background: #ecf5fe;
      font-weight: 500;
    }
    .function-item.shared-item {
      border-left-color: #2b8c5e;
      background: #edfaf3;
      color: #0b412b;
      justify-content: space-between;
    }
    .badge {
      font-size: 0.7rem;
      background: #c8e0f0;
      padding: 0.15rem 0.65rem;
      border-radius: 30px;
      color: #14456b;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      white-space: nowrap;
      flex-shrink: 0;
      margin-left: 0.5rem;
    }
    .badge.success { background: #b8e6cf; color: #0a4a2c; }
    .badge.warning { background: #ffe1b3; color: #7a4a0b; }
    .match-area {
      flex: 1 1 340px;
      background: #ffffff;
      border-radius: 1.8rem;
      padding: 1.5rem;
      box-shadow: 0 12px 30px -8px rgba(20, 60, 100, 0.2);
      border: 1px solid #bed6e9;
    }
    .match-header {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-weight: 600;
      color: #1b4b6e;
      margin-bottom: 1.2rem;
      font-size: 1.1rem;
    }
    .arrow-indicator { font-size: 1.6rem; color: #4e7fa3; }
    .match-result {
      background: #f2f8ff;
      border-radius: 1.4rem;
      padding: 1.2rem;
      min-height: 140px;
      max-height: 260px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      border: 1px solid #cfdef0;
    }
    .match-result::-webkit-scrollbar { width: 5px; }
    .match-result::-webkit-scrollbar-thumb { background: #b8d0e5; border-radius: 20px; }
    .result-line {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem 0.8rem;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 0.85rem;
      padding: 0.3rem 0;
      border-bottom: 1px dashed #d7e5f2;
      padding-bottom: 0.6rem;
    }
    .result-line:last-child { border-bottom: none; }
    .verdict {
      font-weight: 700;
      padding: 0.2rem 0.8rem;
      border-radius: 30px;
      font-family: 'Inter', sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .verdict.reuse { background: #c3edd6; color: #0b4a2a; }
    .verdict.new { background: #ffd9b3; color: #8a4a0a; }
    .btn {
      background: white;
      border: 1.5px solid #b3cee5;
      border-radius: 3rem;
      padding: 0.6rem 1rem;
      font-weight: 500;
      font-size: 0.85rem;
      color: #1b4b6e;
      cursor: pointer;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      font-family: 'Inter', sans-serif;
    }
    .btn-primary {
      background: #1e5a8b;
      border: 1.5px solid #1e5a8b;
      color: white;
    }
    .btn-primary:hover { background: #134b75; border-color: #134b75; }
    .btn-secondary {
      background: white;
      border: 1.5px solid #bbd3e9;
      color: #1e5a8b;
    }
    .btn-secondary:hover { background: #e9f2fc; border-color: #8db3d3; }
    .btn-sm { padding: 0.35rem 0.8rem; font-size: 0.75rem; border-radius: 30px; }
    .btn:active { transform: scale(0.97); }
    .input-row {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.5rem;
      align-items: center;
    }
    .input-row input {
      flex: 1;
      background: #f3f9ff;
      border: 1px solid #bed6e9;
      border-radius: 3rem;
      padding: 0.6rem 1rem;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 0.85rem;
      outline: none;
      min-width: 0;
    }
    .input-row input:focus { border-color: #1e5a8b; box-shadow: 0 0 0 3px #1e5a8b20; }
    .empty-state {
      color: #7e9bb3;
      font-style: italic;
      font-size: 0.85rem;
      padding: 0.5rem 0;
      text-align: center;
    }
    .footer-note {
      margin-top: 2rem;
      font-size: 0.8rem;
      text-align: center;
      color: #6b8aa8;
      border-top: 1px solid #cfdef0;
      padding-top: 1.2rem;
    }
    .action-hint {
      font-size: 0.75rem;
      color: #9e5e1a;
      background: #fbe9d2;
      padding: 0.15rem 0.6rem;
      border-radius: 30px;
      display: inline-flex;
      align-items: center;
      white-space: nowrap;
    }
    .remove-btn {
      background: transparent;
      border: none;
      color: #b14a4a;
      cursor: pointer;
      font-size: 0.9rem;
      padding: 0 0.2rem;
      margin-left: 0.3rem;
      opacity: 0.6;
      line-height: 1;
    }
    .remove-btn:hover { opacity: 1; }
    .divider { border-top: 1px dashed #b8d0e5; margin: 1rem 0 0.8rem 0; }
    .flex-between {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .section-title {
      font-weight: 600;
      color: #1b4b6e;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>
      🧩 Shared Function Matcher
      <span>v3.0</span>
    </h1>
    <div class="subhead">
      Detected functions ko shared library se compare kare — Tool 05 ke output se auto-load.
    </div>

    <div class="grid">
      <div class="panel">
        <div class="panel-header">
          📋 Detected functions
          <i id="detectedCount">0</i>
        </div>
        <div class="function-list" id="detectedList"></div>
        <div class="input-row">
          <input type="text" id="detectedInput" placeholder="e.g. pdf.merge" />
          <button class="btn btn-primary btn-sm" id="addDetectedBtn">➕</button>
        </div>

        <div class="divider"></div>

        <div class="panel-header" style="margin-top: 0.8rem;">
          📚 Shared library
          <i id="sharedCount">0</i>
        </div>
        <div class="function-list" id="sharedList"></div>
        <div class="input-row">
          <input type="text" id="sharedInput" placeholder="e.g. pdf.merge@1.0" />
          <button class="btn btn-primary btn-sm" id="addSharedBtn">➕</button>
        </div>
      </div>

      <div class="match-area">
        <div class="match-header">
          <span>⚡ Match results</span>
          <span class="arrow-indicator">→</span>
        </div>

        <div class="match-result" id="matchResultContainer"></div>

        <div class="flex-between" style="margin-top: 1rem;">
          <div class="section-title"><span>🛠️ Actions</span></div>
          <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
            <button class="btn btn-secondary btn-sm" id="autoCreateAllBtn">⚡ Auto-create missing</button>
            <button class="btn btn-secondary btn-sm" id="clearAllBtn">🗑️ Clear all</button>
          </div>
        </div>
      </div>
    </div>

    <div class="footer-note">
      ⚡ Auto-load from Tool 02 (detected) + Tool 05 (shared). Manual add/remove bhi possible.
    </div>
  </div>

  <script>
    (function() {
      // 🔗 PIPE HELPER
      window.Pipe = {
        save: function(id, data) {
          try { localStorage.setItem('pipe_' + id, JSON.stringify(data)); }
          catch (e) { console.error('Pipe.save fail:', e); }
        },
        load: function(id) {
          var raw = localStorage.getItem('pipe_' + id);
          if (raw === null) return null;
          try { return JSON.parse(raw); } catch (e) { return raw; }
        },
        clear: function(id) { localStorage.removeItem('pipe_' + id); }
      };

      console.log('✅ [04] Pipe helper ready');

      // DOM refs
      var detectedListEl = document.getElementById('detectedList');
      var sharedListEl = document.getElementById('sharedList');
      var matchResultContainer = document.getElementById('matchResultContainer');
      var detectedInput = document.getElementById('detectedInput');
      var sharedInput = document.getElementById('sharedInput');
      var addDetectedBtn = document.getElementById('addDetectedBtn');
      var addSharedBtn = document.getElementById('addSharedBtn');
      var detectedCountEl = document.getElementById('detectedCount');
      var sharedCountEl = document.getElementById('sharedCount');
      var autoCreateAllBtn = document.getElementById('autoCreateAllBtn');
      var clearAllBtn = document.getElementById('clearAllBtn');

      // STATE
      var detectedFunctions = [];
      var sharedFunctions = [];

      // ---------- Helpers ----------
      function getBaseName(fnStr) {
        if (!fnStr) return '';
        var atIndex = fnStr.indexOf('@');
        return atIndex === -1 ? fnStr.trim() : fnStr.substring(0, atIndex).trim();
      }

      function findSharedMatch(detectedBase) {
        for (var i = 0; i < sharedFunctions.length; i++) {
          var sf = sharedFunctions[i];
          if (sf.name === detectedBase) return sf;
          if (sf.id === detectedBase) return sf;
          if (sf.name && sf.name.toLowerCase() === detectedBase.toLowerCase()) return sf;
          if (sf.id && sf.id.toLowerCase() === detectedBase.toLowerCase()) return sf;
        }
        return null;
      }

      // ---------- Rendering ----------
      function renderAll() {
        renderDetectedList();
        renderSharedList();
        renderMatchResults();
        updateCounts();
      }

      function updateCounts() {
        detectedCountEl.textContent = detectedFunctions.length;
        sharedCountEl.textContent = sharedFunctions.length;
      }

      function renderDetectedList() {
        if (!detectedListEl) return;
        if (detectedFunctions.length === 0) {
          detectedListEl.innerHTML = '<div class="empty-state">No detected functions. Add one below.</div>';
          return;
        }
        detectedListEl.innerHTML = detectedFunctions.map(function(fn, idx) {
          return '<div class="function-item detected-item">' +
            '<span>' + escapeHtml(fn) + '</span>' +
            '<span style="display:flex;align-items:center;gap:0.3rem;">' +
              '<span class="badge">detected</span>' +
              '<button class="remove-btn" data-type="detected" data-index="' + idx + '">✕</button>' +
            '</span>' +
          '</div>';
        }).join('');
      }

      function renderSharedList() {
        if (!sharedListEl) return;
        if (sharedFunctions.length === 0) {
          sharedListEl.innerHTML = '<div class="empty-state">No shared functions. Add one below.</div>';
          return;
        }
        sharedListEl.innerHTML = sharedFunctions.map(function(sf, idx) {
          var display = sf.full || (sf.name + '@' + (sf.version || '1.0.0'));
          var deps = sf.dependencies && sf.dependencies.length
            ? ' <span class="badge">' + sf.dependencies.length + ' deps</span>'
            : '';
          return '<div class="function-item shared-item">' +
            '<span>' + escapeHtml(display) + deps + '</span>' +
            '<span style="display:flex;align-items:center;gap:0.3rem;">' +
              '<span class="badge success">✓ available</span>' +
              '<button class="remove-btn" data-type="shared" data-index="' + idx + '">✕</button>' +
            '</span>' +
          '</div>';
        }).join('');
      }

      function renderMatchResults() {
        if (!matchResultContainer) return;

        if (detectedFunctions.length === 0) {
          matchResultContainer.innerHTML = '<div class="empty-state">Add detected functions to see match results.</div>';
          return;
        }

        var lines = detectedFunctions.map(function(detectedFn) {
          var baseName = getBaseName(detectedFn);
          var match = findSharedMatch(baseName);

          if (match) {
            return '<div class="result-line">' +
              '<span style="font-weight:600;">Detected:</span>' +
              '<span style="background:#e4effa;padding:0.15rem 0.7rem;border-radius:20px;">' + escapeHtml(detectedFn) + '</span>' +
              '<span>→</span>' +
              '<span class="verdict reuse">REUSE</span>' +
              '<span style="font-size:0.8rem;color:#136b3f;">✓ ' + escapeHtml(match.full || match.name) + '</span>' +
            '</div>';
          } else {
            return '<div class="result-line">' +
              '<span style="font-weight:600;">Detected:</span>' +
              '<span style="background:#e4effa;padding:0.15rem 0.7rem;border-radius:20px;">' + escapeHtml(detectedFn) + '</span>' +
              '<span>→</span>' +
              '<span class="verdict new">⚠ New Function Required</span>' +
              '<span class="action-hint">➕ create shared</span>' +
            '</div>';
          }
        });

        matchResultContainer.innerHTML = lines.join('');
      }

      function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>"]/g, function(m) {
          if (m === '&') return '&amp;';
          if (m === '<') return '&lt;';
          if (m === '>') return '&gt;';
          if (m === '"') return '&quot;';
          return m;
        });
      }

      // ---------- Operations ----------
      function addDetectedFunction(raw) {
        var trimmed = raw.trim();
        if (!trimmed) { alert('Please enter a function name'); return false; }
        if (detectedFunctions.indexOf(trimmed) !== -1) {
          alert('"' + trimmed + '" already exists in detected functions.');
          return false;
        }
        detectedFunctions.push(trimmed);
        renderAll();
        return true;
      }

      function addSharedFunction(raw) {
        var trimmed = raw.trim();
        if (!trimmed) { alert('Please enter a shared function'); return false; }

        var baseName, version, fullName;
        if (trimmed.indexOf('@') !== -1) {
          var parts = trimmed.split('@');
          baseName = parts[0].trim();
          version = parts[1] ? parts[1].trim() : '1.0';
          fullName = baseName + '@' + version;
        } else {
          baseName = trimmed;
          version = '1.0';
          fullName = baseName + '@' + version;
        }

        if (!baseName) { alert('Function name cannot be empty.'); return false; }

        var exists = sharedFunctions.some(function(sf) {
          return (sf.full || '').toLowerCase() === fullName.toLowerCase();
        });
        if (exists) { alert('"' + fullName + '" already exists.'); return false; }

        sharedFunctions.push({
          name: baseName,
          version: version,
          full: fullName,
          id: baseName,
          dependencies: []
        });
        renderAll();
        return true;
      }

      function removeDetected(index) {
        if (index >= 0 && index < detectedFunctions.length) {
          detectedFunctions.splice(index, 1);
          renderAll();
        }
      }

      function removeShared(index) {
        if (index >= 0 && index < sharedFunctions.length) {
          sharedFunctions.splice(index, 1);
          renderAll();
        }
      }

      function autoCreateMissing() {
        if (detectedFunctions.length === 0) {
          alert('No detected functions to process.');
          return;
        }
        var missing = detectedFunctions.filter(function(fn) {
          var base = getBaseName(fn);
          return !findSharedMatch(base);
        });
        if (missing.length === 0) {
          alert('All detected functions already have a shared match.');
          return;
        }
        var confirmMsg = 'Create ' + missing.length + ' shared function(s) for:\n\n' +
          missing.map(function(f) { return '• ' + f + ' → ' + f + '@1.0'; }).join('\n') +
          '\n\nProceed?';
        if (!confirm(confirmMsg)) return;

        var added = 0;
        missing.forEach(function(fn) {
          var baseName = getBaseName(fn);
          var fullName = baseName + '@1.0';
          var exists = sharedFunctions.some(function(sf) {
            return (sf.full || '').toLowerCase() === fullName.toLowerCase();
          });
          if (!exists) {
            sharedFunctions.push({
              name: baseName,
              version: '1.0',
              full: fullName,
              id: baseName,
              dependencies: []
            });
            added++;
          }
        });
        if (added > 0) {
          renderAll();
          alert('✅ Created ' + added + ' new shared function(s).');
        }
      }

      function clearAll() {
        if (detectedFunctions.length === 0 && sharedFunctions.length === 0) return;
        if (!confirm('Clear all detected and shared functions?')) return;
        detectedFunctions = [];
        sharedFunctions = [];
        renderAll();
      }

      // ---------- Event listeners ----------
      addDetectedBtn.addEventListener('click', function() {
        if (addDetectedFunction(detectedInput.value)) {
          detectedInput.value = '';
          detectedInput.focus();
        }
      });
      detectedInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') { e.preventDefault(); addDetectedBtn.click(); }
      });

      addSharedBtn.addEventListener('click', function() {
        if (addSharedFunction(sharedInput.value)) {
          sharedInput.value = '';
          sharedInput.focus();
        }
      });
      sharedInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') { e.preventDefault(); addSharedBtn.click(); }
      });

      document.addEventListener('click', function(e) {
        var target = e.target.closest('.remove-btn');
        if (!target) return;
        var type = target.getAttribute('data-type');
        var index = parseInt(target.getAttribute('data-index'), 10);
        if (isNaN(index)) return;
        if (type === 'detected') removeDetected(index);
        else if (type === 'shared') removeShared(index);
      });

      autoCreateAllBtn.addEventListener('click', autoCreateMissing);
      clearAllBtn.addEventListener('click', clearAll);

      // ---------- AUTO-LOAD ----------
      function loadFromDetector() {
        // 1. Detected functions from Tool 02
        var analysis = window.Pipe.load('02');
        if (analysis && analysis.functions && analysis.functions.length) {
          var detected = analysis.functions.map(function(f) { return f.name; });
          detectedFunctions = detected.filter(function(v, i, a) { return a.indexOf(v) === i; });
          console.log('✅ [04] Loaded ' + detectedFunctions.length + ' detected functions from Tool 02');
        } else {
          console.log('ℹ️ [04] No Tool 02 output.');
        }

        // 2. Shared library from Tool 05 (pipe_shared)
        var shared = window.Pipe.load('shared');
        if (shared && shared.functions && typeof shared.functions === 'object') {
          sharedFunctions = Object.keys(shared.functions).map(function(key) {
            var fn = shared.functions[key];
            return {
              name: fn.name || key,
              id: key,
              version: fn.version || '1.0.0',
              full: (fn.name || key) + '@' + (fn.version || '1.0.0'),
              category: fn.category || 'misc',
              subCategory: fn.subCategory || '',
              dependencies: fn.dependencies || [],
              folder: fn.folder || ''
            };
          });
          console.log('✅ [04] Loaded ' + sharedFunctions.length + ' shared functions from pipe_shared');
        } else {
          console.log('ℹ️ [04] No pipe_shared found. Run Tool 05 + Save.');
        }
      }

      // ---------- INIT ----------
      loadFromDetector();
      renderAll();

      // ---------- Auto-save pipe_04 ----------
      var _renderAll_original = renderAll;
      renderAll = function() {
        _renderAll_original();
        var results = detectedFunctions.map(function(fn) {
          var base = getBaseName(fn);
          var match = findSharedMatch(base);
          return {
            name: fn,
            matched: !!match,
            sharedId: match ? match.id : null,
            sharedFull: match ? match.full : null
          };
        });
        window.Pipe.save('04', {
          detected: detectedFunctions,
          shared: sharedFunctions,
          results: results,
          timestamp: new Date().toISOString()
        });
      };

      console.log('✅ [04] init done — detected:', detectedFunctions.length, '| shared:', sharedFunctions.length);

    })();
  </script>
</body>
</html>
