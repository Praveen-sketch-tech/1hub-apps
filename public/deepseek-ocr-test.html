<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DeepSeek OCR 2 Test</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
.wrap{max-width:900px;margin:auto;padding:24px 16px}
.card{background:white;border:1px solid #e1e6ef;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 4px 18px #00000008}
h1{margin:0 0 6px;font-size:25px}
.sub{color:#667085;margin-bottom:20px}
.drop{border:2px dashed #b8c1d1;border-radius:14px;padding:35px 20px;text-align:center;cursor:pointer}
.drop:hover{border-color:#667085}
input{display:none}
button{border:0;border-radius:10px;padding:12px 20px;font-size:15px;cursor:pointer;margin-top:14px}
#run{background:#111827;color:white}
#run:disabled{opacity:.5;cursor:not-allowed}
.status{margin-top:14px;padding:12px;border-radius:10px;background:#f1f5f9;white-space:pre-wrap}
.preview{max-width:100%;max-height:400px;display:block;margin:15px auto;border-radius:10px}
.result{white-space:pre-wrap;font-family:Arial,sans-serif;line-height:1.65;background:#fafafa;border-radius:12px;padding:18px;overflow:auto}
.small{font-size:13px;color:#667085}
</style>
</head>
<body>

<div class="wrap">

<div class="card">
<h1>🔎 DeepSeek OCR 2</h1>
<div class="sub">Hindi + English OCR — Remote API Test</div>

<div class="drop" id="drop">
  <div>📷 Select an image</div>
  <div class="small">Tap here to choose JPG / PNG</div>
  <input id="file" type="file" accept="image/*">
</div>

<img id="preview" class="preview" hidden>

<button id="run" disabled>Run OCR</button>

<div id="status" class="status">Waiting for image...</div>
</div>

<div class="card">
<h2>OCR Result</h2>
<div id="result" class="result">OCR result will appear here...</div>
</div>

</div>

<script>
const SPACE = "https://merterbak-deepseek-ocr-demo.hf.space";

const fileInput = document.getElementById("file");
const drop = document.getElementById("drop");
const preview = document.getElementById("preview");
const runBtn = document.getElementById("run");
const statusBox = document.getElementById("status");
const resultBox = document.getElementById("result");

let selectedFile = null;

drop.onclick = () => fileInput.click();

fileInput.onchange = () => {
  selectedFile = fileInput.files[0];

  if (!selectedFile) return;

  preview.src = URL.createObjectURL(selectedFile);
  preview.hidden = false;

  runBtn.disabled = false;
  statusBox.textContent = `✅ Selected: ${selectedFile.name}`;
  resultBox.textContent = "OCR result will appear here...";
};

runBtn.onclick = async () => {
  if (!selectedFile) return;

  runBtn.disabled = true;
  resultBox.textContent = "";

  try {
    // --------------------------------------------------
    // Upload
    // --------------------------------------------------
    statusBox.textContent = "📤 Uploading image...";

    const form = new FormData();
    form.append("files", selectedFile);

    const uploadResponse = await fetch(
      `${SPACE}/gradio_api/upload`,
      {
        method: "POST",
        body: form
      }
    );

    if (!uploadResponse.ok) {
      throw new Error("Upload failed: HTTP " + uploadResponse.status);
    }

    const uploaded = await uploadResponse.json();
    const remotePath = uploaded[0];

    statusBox.textContent =
      "✅ Uploaded\n📍 Remote path received\n\n🚀 Starting OCR...";

    // --------------------------------------------------
    // Start OCR
    // --------------------------------------------------
    const fileData = {
      path: remotePath,
      url: remotePath,
      orig_name: selectedFile.name,
      mime_type: selectedFile.type || "image/jpeg",
      is_stream: false,
      meta: {
        _type: "gradio.FileData"
      }
    };

    const runResponse = await fetch(
      `${SPACE}/gradio_api/call/run`,
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          data: [
            fileData,
            fileData,
            "📝 Free OCR",
            "",
            1
          ]
        })
      }
    );

    if (!runResponse.ok) {
      throw new Error("OCR start failed: HTTP " + runResponse.status);
    }

    const runData = await runResponse.json();
    const eventId = runData.event_id;

    if (!eventId) {
      throw new Error("No event ID returned");
    }

    statusBox.textContent =
      "✅ OCR started\n🆔 Event: " + eventId +
      "\n\n⏳ Processing...";

    // --------------------------------------------------
    // SSE result
    // --------------------------------------------------
    const resultResponse = await fetch(
      `${SPACE}/gradio_api/call/run/${eventId}`,
      {
        headers: {
          "Accept": "text/event-stream"
        }
      }
    );

    if (!resultResponse.ok) {
      throw new Error(
        "OCR result failed: HTTP " + resultResponse.status
      );
    }

    const reader = resultResponse.body.getReader();
    const decoder = new TextDecoder();

    let buffer = "";

    while (true) {
      const {value, done} = await reader.read();

      if (done) break;

      buffer += decoder.decode(value, {stream:true});

      const lines = buffer.split("\n");
      buffer = lines.pop();

      for (const line of lines) {

        if (line.startsWith("event:")) {
          const event = line.slice(6).trim();

          if (event === "complete") {
            statusBox.textContent =
              "✅ OCR completed successfully";
          }

          if (event === "error") {
            throw new Error("DeepSeek OCR returned error");
          }
        }

        if (line.startsWith("data:")) {
          const data = line.slice(5).trim();

          if (!data || data === "null") continue;

          try {
            const parsed = JSON.parse(data);

            if (Array.isArray(parsed) && parsed.length) {
              resultBox.textContent = parsed[0] || "";
            }
          } catch (e) {
            // Ignore incomplete SSE chunks
          }
        }
      }
    }

    if (!resultBox.textContent.trim()) {
      resultBox.textContent = "⚠️ No OCR text returned.";
    }

  } catch (error) {

    console.error(error);

    statusBox.textContent =
      "❌ Error\n" + error.message;

    resultBox.textContent =
      "OCR failed:\n\n" + error.message;

  } finally {
    runBtn.disabled = false;
  }
};
</script>

</body>
</html>
