<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TurboDocx Diagnostic Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      padding: 20px;
      margin: 0;
    }

    .box {
      max-width: 800px;
      margin: auto;
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
    }

    h1 {
      margin-top: 0;
    }

    .status {
      padding: 12px;
      margin: 8px 0;
      border-radius: 8px;
      font-family: monospace;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .ok {
      background: #dff5e3;
      color: #176b2c;
    }

    .bad {
      background: #ffe1e1;
      color: #9b1c1c;
    }

    .info {
      background: #e5efff;
      color: #174a91;
    }

    button {
      padding: 12px 18px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 10px;
    }

    #testBtn {
      background: #1f3a5f;
      color: white;
    }

    #clearBtn {
      background: #ddd;
      margin-left: 8px;
    }

    pre {
      background: #111;
      color: #eee;
      padding: 14px;
      border-radius: 8px;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>

  <!-- =========================================================
       STEP 1: Browser polyfills
       ========================================================= -->

  <script>
    window.__turboDiagnostics = {
      scriptStarted: true,
      errors: []
    };

    // global
    if (typeof global === 'undefined') {
      window.global = window;
    }

    // process
    if (typeof process === 'undefined') {
      window.process = {
        env: {}
      };
    }

    // Buffer
    if (typeof Buffer === 'undefined') {
      window.Buffer = {
        from: function(data, encoding) {

          if (typeof data === 'string') {

            if (encoding === 'base64') {
              const binary = atob(data);
              const bytes = new Uint8Array(binary.length);

              for (let i = 0; i < binary.length; i++) {
                bytes[i] = binary.charCodeAt(i);
              }

              return bytes;
            }

            return new TextEncoder().encode(data);
          }

          return new Uint8Array(data);
        },

        isBuffer: function() {
          return false;
        }
      };
    }

    console.log("DIAGNOSTIC: polyfills initialized");
    console.log("global =", typeof global);
    console.log("process =", typeof process);
    console.log("Buffer =", typeof Buffer);
  </script>

  <!-- =========================================================
       STEP 2: TurboDocx ESM + post-processing helpers
       ========================================================= -->
  <script type="module">
    import HTMLToDOCX from "./turbodocx.browser.esm.js";
    import { A4, DEFAULT_MARGINS_TWIPS } from "./docx-postprocess.js";

    window.__TurboDocx = HTMLToDOCX;
    window.__DocxA4 = A4;
    window.__DocxMargins = DEFAULT_MARGINS_TWIPS;
    window.__turboDiagnostics.scriptLoaded = true;

    console.log("DIAGNOSTIC: TurboDocx ESM loaded");
    console.log("typeof imported HTMLToDOCX =", typeof HTMLToDOCX);
    console.log("typeof window.__TurboDocx =", typeof window.__TurboDocx);

    if (typeof HTMLToDOCX !== "function") {
      window.__turboDiagnostics.errors.push(
        "TurboDocx ESM default export is not a function"
      );
    }
  </script>

</head>

<body>

<div class="box">

  <h1>🧪 TurboDocx Diagnostic</h1>

  <div id="status"></div>

  <button id="testBtn" type="button">
    🧪 Test DOCX Generation
  </button>

  <button id="testBtn2" type="button">
    🔁 Generate Again (no refresh)
  </button>

  <button id="clearBtn" type="button">
    Clear
  </button>

  <h3>Diagnostic Output</h3>

  <pre id="output">Waiting...</pre>

</div>

<script type="module">

import {
  hasRenderableContent,
  finalizeDocx,
  A4,
  DEFAULT_MARGINS_TWIPS,
} from "./docx-postprocess.js";

(function() {

  const status = document.getElementById("status");
  const output = document.getElementById("output");
  const testBtn = document.getElementById("testBtn");
  const testBtn2 = document.getElementById("testBtn2");

  // Guards against overlapping/rapid-click generations (see audit §2 & §11):
  // a second click while one is already in flight is ignored rather than
  // starting a concurrent generation, which is one of the things that can
  // trip a browser's "multiple automatic downloads" throttling.
  let isGenerating = false;

  function addStatus(message, type) {

    const div = document.createElement("div");

    div.className = "status " + type;

    div.textContent = message;

    status.appendChild(div);
  }

  function log(message) {

    console.log(message);

    output.textContent += "\n" + message;
  }

  // Catch global JS errors
  window.addEventListener("error", function(event) {

    const message =
      "GLOBAL ERROR: " +
      (event.message || "Unknown error") +
      "\nFile: " +
      (event.filename || "unknown") +
      "\nLine: " +
      (event.lineno || "?");

    window.__turboDiagnostics.errors.push(message);

    log(message);

    addStatus("❌ JavaScript Error detected", "bad");

  });

  // Catch rejected promises
  window.addEventListener("unhandledrejection", function(event) {

    const reason =
      event.reason && event.reason.message
        ? event.reason.message
        : String(event.reason);

    const message =
      "UNHANDLED PROMISE ERROR: " + reason;

    window.__turboDiagnostics.errors.push(message);

    log(message);

    addStatus("❌ Promise Error detected", "bad");

  });

  function runDiagnostics() {

    status.innerHTML = "";

    output.textContent = "";

    log("===== TurboDocx Diagnostics =====");

    log(
      "User Agent: " +
      navigator.userAgent
    );

    log(
      "Page URL: " +
      location.href
    );

    log(
      "Online: " +
      navigator.onLine
    );

    log(
      "global: " +
      typeof window.global
    );

    log(
      "process: " +
      typeof window.process
    );

    log(
      "Buffer: " +
      typeof window.Buffer
    );

    log(
      "HTMLtoDOCX: " +
      typeof window.__TurboDocx
    );

    log(
      "htmlToDocx: " +
      typeof window.htmlToDocx
    );

    log(
      "Turbo script loaded flag: " +
      window.__turboDiagnostics.scriptLoaded
    );

    log(
      "Errors: " +
      window.__turboDiagnostics.errors.length
    );

    if (typeof window.__TurboDocx === "function") {

      addStatus(
        "✅ TurboDocx loaded correctly: HTMLtoDOCX is a function",
        "ok"
      );

    } else {

      addStatus(
        "❌ TurboDocx NOT initialized: HTMLtoDOCX is not a function",
        "bad"
      );

    }

    if (window.__turboDiagnostics.scriptLoaded === false) {

      addStatus(
        "❌ CDN script failed to load",
        "bad"
      );

    }

    log("===== End Diagnostics =====");

  }

  // Run automatically
  window.addEventListener("load", function() {

    setTimeout(runDiagnostics, 500);

  });

  // Test fixture: exercises Hindi+English, bold, italic, all four
  // alignments, a bulleted + numbered list, and a table — closing the
  // coverage gap flagged in the audit (this page previously tested no
  // alignment modes and no lists at all).
  function buildTestHtml(label) {
    return `
      <!DOCTYPE html>
      <html>
      <head><meta charset="UTF-8"></head>
      <body>
        <h1>TurboDocx Test ${label}</h1>

        <p>यह हिंदी परीक्षण है। This is an English test.</p>
        <p><strong>Bold Hindi:</strong> यह बोल्ड टेक्स्ट है।</p>
        <p><em>Italic English</em></p>

        <p style="text-align:left">Left aligned paragraph.</p>
        <p style="text-align:center">केंद्रित पाठ (Centered text)</p>
        <p style="text-align:right">Right aligned paragraph.</p>
        <p style="text-align:justify">Justify aligned paragraph with enough text to wrap across more than one line so the justification behavior is actually visible in the output.</p>

        <ul><li>Bullet one</li><li>Bullet two</li></ul>
        <ol><li>Numbered one</li><li>Numbered two</li></ol>

        <table border="1">
          <tr><th>हिंदी</th><th>English</th></tr>
          <tr><td>परीक्षण</td><td>Test</td></tr>
        </table>
      </body>
      </html>
    `;
  }

  // Empty-content fixture used only to demonstrate the blank-input guard.
  const EMPTY_TEST_HTML = "   \n  <p></p> \n  ";

  async function runGeneration(label, { simulateEmpty = false } = {}) {

    if (typeof window.__TurboDocx !== "function") {
      addStatus("❌ Cannot test DOCX: HTMLtoDOCX is unavailable", "bad");
      return;
    }

    if (isGenerating) {
      log("Ignored click: a generation is already in progress.");
      return;
    }

    const html = simulateEmpty ? EMPTY_TEST_HTML : buildTestHtml(label);

    // --- Fix: reject empty/whitespace-only content BEFORE calling the
    //     engine, so a blank document can never be produced. ---
    if (!hasRenderableContent(html)) {
      addStatus(
        "❌ Nothing to export — the content is empty or whitespace-only.",
        "bad"
      );
      log("Blocked generation: no renderable content.");
      return;
    }

    isGenerating = true;
    testBtn.disabled = true;
    testBtn2.disabled = true;

    try {
      addStatus("⏳ Generating real DOCX (" + label + ")...", "info");

      const options = {
        font: "Segoe UI",
        pageSize: {
          width: A4.WIDTH_TWIPS,
          height: A4.HEIGHT_TWIPS,
        },
        margins: DEFAULT_MARGINS_TWIPS,
        table: {
          row: { cantSplit: true },
        },
      };

      log("Calling HTMLtoDOCX...");

      const result = await window.__TurboDocx(html, null, options);

      log("Result type: " + Object.prototype.toString.call(result));

      // --- Fix: normalize + validate + repair the result in one step,
      //     instead of a bare `instanceof Blob` branch and a
      //     `blob.size < 100` sanity check (which cannot catch a blank
      //     document, since the empty-content skeleton is already ~20KB).
      //     finalizeDocx() also forces A4 page size and patches in a real
      //     Devanagari font + hi-IN language metadata for Hindi text. ---
      const blob = await finalizeDocx(result, {
        bodyFont: "Segoe UI",
        hindiFont: "Noto Sans Devanagari",
      });

      log("Finalized blob size: " + blob.size + " bytes");

      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "turbodocx_diagnostic_test_" + label + ".docx";
      document.body.appendChild(link);
      link.click();
      link.remove();

      setTimeout(function () {
        URL.revokeObjectURL(url);
      }, 5000);

      addStatus("✅ REAL DOCX GENERATED AND DOWNLOAD STARTED (" + label + ")", "ok");
      log("DOCX generation SUCCESS (" + label + ")");

    } catch (error) {

      console.error("DOCX generation error:", error);
      addStatus("❌ DOCX generation failed: " + (error.message || error), "bad");
      log("DOCX ERROR: " + (error.stack || error.message || error));

    } finally {
      isGenerating = false;
      testBtn.disabled = false;
      testBtn2.disabled = false;
    }
  }

  testBtn.addEventListener("click", function () {
    runGeneration("A");
  });

  // Exercises "repeated download without refresh" directly from the UI:
  // click Test, then click this one immediately after — no page reload.
  testBtn2.addEventListener("click", function () {
    runGeneration("B");
  });

  document
    .getElementById("clearBtn")
    .addEventListener("click", function() {

      status.innerHTML = "";

      output.textContent = "Cleared.";

    });

})();

</script>

</body>
</html>
